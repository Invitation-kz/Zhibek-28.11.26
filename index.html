<!doctype html>
<html lang="ru">
    <head>
        <!-- Шрифт Lora (кириллица + казахские буквы) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&display=swap&subset=cyrillic,cyrillic-ext"
            rel="stylesheet"
        />

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous"
        />

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:title" content="Жібектің қыз ұзату тойына шақыру!" />
        <meta property="og:description" content="28.11.2026" />
        <meta
            property="og:image"
            content="https://lh3.googleusercontent.com/pw/AP1GczOkhgdsYUCq9jXx2FYahvjt1IwzGyPh_Ew_oNw7N4OpwoCFGFSzS8Xo6GwNk6Z-OhfumZyV2zkNYjrP-qp2Cz6on2NRPcNuNN4rBgaawKkuVGCwgHZhrna67O0GHUxp4PHSjfSGurZGY16ht_kL7zZO=w1064-h869-s-no-gm?authuser=0"
        />

        <link rel="stylesheet" href="css.css" />

        <title>Жібектің қыз ұзату тойына шақыру!</title>

        <style>
            :root {
                --font: "Lora", Georgia, "Times New Roman", serif;
            }

            /* Единый шрифт для всей страницы */
            html,
            body,
            button,
            input,
            textarea,
            label,
            span,
            h2 {
                font-family: var(--font);
            }

            @media screen and (max-width: 1280px) {
                div.contentblock {
                    width: 1200px;
                }
            }
            @media screen and (max-width: 1140px) {
                div.contentblock {
                    width: 1024px;
                }
            }
            @media screen and (max-width: 992px) {
                div.contentblock {
                    width: 970px;
                }
            }

            .element-animation {
                top: 0px;
                opacity: 0;
                position: relative;
            }
            .element-animation.element-show {
                position: relative;
                top: 20px;
                opacity: 1;
                transition-duration: 1.4s;
            }

            .conteiner {
                background-size: 100%;
                overflow: hide;
                width: 100%;
                height: 50%;
            }
            .countdown-container {
                margin: 0;
                font-family: var(--font);
                font-size: 0.7rem;
                font-weight: 400;
                line-height: 1;
                -webkit-text-size-adjust: 80%;
                -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
                display: flex;
                justify-content: center;
                background-color: none;
            }

            .countdown-item {
                position: relative;
                min-width: 40px;
                margin-left: 10px;
                margin-right: 10px;
                padding-bottom: 10px;
            }

            .countdown:not(:last-child)::after {
                content: ":";
                position: absolute;
                right: -15px;
            }

            .countdown-item span {
                display: block;
                font-size: 35px;
                margin-bottom: 1px;
                color: #3f3f3f;
                border-radius: 5px;
                padding: 5px;
                animation: pulse 1s ease infinite alternate;
            }

            .form-inner {
                position: relative;
            }

            .form-inner label {
                display: block;
                padding-left: 15px;
                font-family: var(--font);
                color: rgba(255, 255, 255, 0.6);
                text-transform: uppercase;
                font-size: 15px;
                padding: 0 15px;
                margin: 10px 0 15px;
            }

            .btn {
                padding: 10px 20px;
                background-color: #007bff;
                color: #fff;
                border: none;

                transition: transform 0.3s ease;
            }

            /* Стили для кнопки с эффектом при нажатии */
            .btn {
                transform: scale(1.1); /* Увеличиваем кнопку при активации */
            }

            .form-inner textarea {
                width: 80%;
                text-align: center;
                margin-top: 5px;

                border-radius: 10px;
                margin-bottom: 5px;
                font-size: 16px;
                font-weight: 400;
                background-color: #fffef8;
                border-color: #1d3f57 0.5px;
                letter-spacing: 0.11em;
                height: 30px;
                font-family: var(--font);
            }

            .form-inner input[type="submit"] {
                background: linear-gradient(to top left, #621e07 0%, #621e07 100%);
                width: 80%;
                height: 30px;
                text-align: center;
                border: 0;
                border-bottom: 2px #aaa;
                border-radius: 10px;
                font-size: 16px;
                font-weight: 400;
                background-color: #fffaf8;
                letter-spacing: 0.11em;
                font-family: var(--font);
                padding: 0 15px;
                margin: 10px 0 15px;
            }
            .radio-group {
                text-align: left;
                width: 80%;
                font-size: 20px;
                margin-top: 7px;
                margin-bottom: 7px;
                color: #585856;
                color: rgba(88, 88, 86, 0.7);
            }

            body {
                background-color: #f2e6da;
            }
        </style>

        <style>
            .fade-in {
                opacity: 0;
                transform: translateY(20px);
                transition:
                    opacity 1s ease-out,
                    transform 1s ease-out;
            }
            .fade-in.visible {
                opacity: 1;
                transform: translateY(0);
            }
        </style>

        <style>
            /* Стили для модального окна */
            .modal {
                display: block; /* Модальное окно отображается сразу */
                position: fixed;
                z-index: 9999; /* Модальное окно поверх всех элементов */
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.8); /* Затемнённый фон */
            }
            .modal-content {
                background-color: #f2e6da;
                margin: 30% auto;
                padding: 20px;
                border: 1px solid #888;
                width: 80%;
                text-align: center;
            }
            .kk {
                width: 100%;
                height: 100%;
            }

            /* Кнопка «Шақыртуды ашу» */
            #playMusic {
                position: relative;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                margin-top: 18px;
                padding: 14px 38px;
                font-family: var(--font);
                font-size: 18px;
                font-weight: 500;
                letter-spacing: 0.06em;
                color: #f7ecdf;
                background: linear-gradient(160deg, #7d2a0d 0%, #621e07 55%, #4a1505 100%);
                border: 1px solid #c9a46a;
                border-radius: 999px;
                box-shadow:
                    0 0 0 4px rgba(201, 164, 106, 0.25),
                    0 8px 20px rgba(98, 30, 7, 0.35);
                cursor: pointer;
                transition:
                    transform 0.25s ease,
                    box-shadow 0.25s ease;
                animation: invitePulse 2.4s ease-in-out infinite;
            }
            #playMusic::before {
                content: "♪";
                font-size: 20px;
                color: #e3c48b;
            }
            #playMusic:hover {
                transform: translateY(-2px);
                box-shadow:
                    0 0 0 5px rgba(201, 164, 106, 0.35),
                    0 12px 26px rgba(98, 30, 7, 0.45);
            }
            #playMusic:active {
                transform: translateY(0) scale(0.97);
            }
            #playMusic:focus-visible {
                outline: 2px solid #c9a46a;
                outline-offset: 4px;
            }
            @keyframes invitePulse {
                0%,
                100% {
                    box-shadow:
                        0 0 0 4px rgba(201, 164, 106, 0.25),
                        0 8px 20px rgba(98, 30, 7, 0.35);
                }
                50% {
                    box-shadow:
                        0 0 0 10px rgba(201, 164, 106, 0),
                        0 8px 20px rgba(98, 30, 7, 0.35);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #playMusic {
                    animation: none;
                }
            }

            /* Отключение скроллинга страницы */
            body.modal-open {
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <div class="fade-in" id="content">
            <img src="photo1.jpg" style="width: 100%; height: 100%" loading="eager" />
        </div>

        <center>
            <div class="element-animation">
                <img src="photo2.jpg" style="width: 100%; margin-top: 0px" />
            </div>
        </center>

        <img src="photo3.jpg" style="width: 100%; left: 0px; margin-top: 50px" />

        <center>
            <div class="element-animation">
                <a href="https://go.2gis.com/pLxAa">
                    <img src="photo4.jpg" style="width: 100%; margin-top: 10px; margin-bottom: 0px"
                /></a>
            </div>
        </center>

        <center>
            <div class="element-animation">
                <img src="photo5.jpg" style="width: 100%; margin-top: 50px; margin-bottom: 10px" />
            </div>
        </center>

        <center style="margin-top: 0px">
            <form class="transparent" method="post" id="form">
                <div class="form-inner">
                    <div class="radio-group" required>
                        <input type="radio" id="question1_yes" name="name" value="Иә барамын" required />
                        <label for="question1_yes">Иә барамын</label><br />
                        <input type="radio" id="question1_no" name="name" value="Бара алмаймын" required />
                        <label for="question1_no">Бара алмаймын</label><br />
                        <input type="radio" id="question1_maybe" name="name" value="Әзірге белгісіз" required />
                        <label for="question1_maybe">Әзірге белгісіз</label>
                    </div>
                    <textarea
                        required
                        name="message"
                        maxlength="100"
                        id="message"
                        cols="30"
                        rows="4"
                        placeholder="Есіміңізді жазыңыз"
                    ></textarea>
                    <input type="submit" value="Жіберу" style="color: white" class="btn" />
                </div>
            </form>
        </center>

        <center>
            <div class="element-animation">
                <img src="photo6.jpg" style="width: 100%; margin-top: 50px; margin-bottom: 15px" />
            </div>
        </center>

        <center>
            <div class="countdown-container" style="margin-top: 10px">
                <div class="countdown-item" style="margin-bottom: 30px">
                    <span id="days"></span>
                    <span style="font-size: 13px; text-align: center">күн</span>
                </div>
                <h2 style="margin-top: 3px; size: 30px">:</h2>
                <div class="countdown-item">
                    <span id="hours"></span>
                    <span style="font-size: 13px; text-align: center">сағат</span>
                </div>
                <h2 style="margin-top: 3px; size: 30px">:</h2>
                <div class="countdown-item">
                    <span id="minutes"></span>
                    <span style="font-size: 13px; text-align: center; text-align: center">минут</span>
                </div>
                <h2 style="margin-top: 3px; size: 30px">:</h2>
                <div class="countdown-item">
                    <span id="seconds"></span>
                    <span style="font-size: 13px; text-align: center">секунд</span>
                </div>
            </div>
        </center>

        <img src="photo7.jpg" style="width: 100%; margin-top: 50px" />

        <!-- Модальное окно -->
        <div id="musicModal" class="modal">
            <div class="modal-content">
                <img src="photo.jpg" />
                <button id="playMusic" type="button">Шақыртуды ашу</button>
            </div>
        </div>

        <audio id="backgroundMusic" loop>
            <source src="music.mp3" type="audio/mpeg" />
            Ваш браузер не поддерживает воспроизведение музыки.
        </audio>

        <script>
            // Получаем модальное окно, кнопку и аудио
            var modal = document.getElementById("musicModal");
            var playButton = document.getElementById("playMusic");
            var audio = document.getElementById("backgroundMusic");

            // При нажатии на кнопку включаем музыку и закрываем модальное окно
            playButton.onclick = function () {
                audio.play();
                closeModal();
            };

            // Функция для закрытия модального окна и разблокировки сайта
            function closeModal() {
                modal.style.display = "none"; // Скрываем модальное окно
                document.body.classList.remove("modal-open"); // Включаем прокрутку
            }
        </script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                var observer = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("visible");
                            observer.unobserve(entry.target);
                        }
                    });
                });

                var elements = document.querySelectorAll(".fade-in");
                elements.forEach(function (element) {
                    observer.observe(element);
                });
            });
        </script>

        <script>
            // Сюда вставьте ссылку веб-приложения Apps Script (заканчивается на /exec)
            const URL_APP =
                "https://script.google.com/macros/s/AKfycbxYY3ueUztvW7w4xO8xuAhmFxSOvtPUW3CQLUmzP7YurD5jKOPSjN1hYPPCofkdE1HhUA/exec";

            const form = document.querySelector("#form");
            const submitButton = form.querySelector('input[type="submit"]');

            form.action = URL_APP;

            function isFilled(details) {
                const { name, message } = details;
                if (!name || !message) return false;
                return true;
            }

            form.addEventListener("submit", async ev => {
                ev.preventDefault();

                const name = document.querySelector("[name=name]:checked");
                const message = document.querySelector("[name=message]");

                let details = {
                    name: name ? name.value : "",
                    message: message.value.trim(),
                };

                if (!isFilled(details)) {
                    alert("Жауабыңызды таңдап, есіміңізді жазыңыз");
                    return;
                }

                let formBody = [];
                for (let property in details) {
                    let encodedKey = encodeURIComponent(property);
                    let encodedValue = encodeURIComponent(details[property]);
                    formBody.push(encodedKey + "=" + encodedValue);
                }
                formBody = formBody.join("&");

                submitButton.disabled = true;

                // Деректерді серверге жіберу
                fetch(URL_APP, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
                    },
                    mode: "no-cors",
                    body: formBody,
                })
                    .then(() => {
                        form.reset();
                        alert("Жауабыңызға рахмет!");
                    })
                    .catch(err => {
                        console.error("Error:", err);
                        alert("Ошибка!");
                    })
                    .finally(() => {
                        submitButton.disabled = false; // Жіберу батырмасын қайта қосу
                    });
            });

            function onEntry(entry) {
                entry.forEach(change => {
                    if (change.isIntersecting) {
                        change.target.classList.add("element-show");
                    }
                });
            }
            let options = {
                threshold: [0.5],
            };
            let observer = new IntersectionObserver(onEntry, options);
            let elements = document.querySelectorAll(".element-animation");

            for (let elm of elements) {
                observer.observe(elm);
            }
        </script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                function updateCountdown() {
                    const endDate = new Date("November 28, 2026 17:00:00").getTime();
                    const now = new Date().getTime();
                    const distance = endDate - now;

                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    document.getElementById("days").innerText = days;
                    document.getElementById("hours").innerText = hours;
                    document.getElementById("minutes").innerText = minutes;
                    document.getElementById("seconds").innerText = seconds;

                    if (distance < 0) {
                        clearInterval(timerInterval);
                        document.getElementById("days").innerText = "00";
                        document.getElementById("hours").innerText = "00";
                        document.getElementById("minutes").innerText = "00";
                        document.getElementById("seconds").innerText = "00";
                    }
                }

                const timerInterval = setInterval(updateCountdown, 1000);
                updateCountdown();
            });
        </script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"
            async
        ></script>
    </body>
</html>
