<!doctype html>
<html lang="ru">
    <head>
        <!-- Шрифт Lora (кириллица + казахские буквы) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&display=swap&subset=cyrillic,cyrillic-ext"
            rel="stylesheet"
        />

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous"
        />

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:title" content="Жібектің қыз ұзату тойына шақыру!" />
        <meta property="og:description" content="28.11.2026" />
        <meta
            property="og:image"
            content="https://lh3.googleusercontent.com/pw/AP1GczOkhgdsYUCq9jXx2FYahvjt1IwzGyPh_Ew_oNw7N4OpwoCFGFSzS8Xo6GwNk6Z-OhfumZyV2zkNYjrP-qp2Cz6on2NRPcNuNN4rBgaawKkuVGCwgHZhrna67O0GHUxp4PHSjfSGurZGY16ht_kL7zZO=w1064-h869-s-no-gm?authuser=0"
        />

        <link rel="stylesheet" href="css.css" />

        <title>Жібектің қыз ұзату тойына шақыру!</title>

        <style>
            :root {
                --font: "Lora", Georgia, "Times New Roman", serif;
            }

            /* Единый шрифт для всей страницы */
            html,
            body,
            button,
            input,
            textarea,
            label,
            span,
            h2 {
                font-family: var(--font);
            }

            @media screen and (max-width: 1280px) {
                div.contentblock {
                    width: 1200px;
                }
            }
            @media screen and (max-width: 1140px) {
                div.contentblock {
                    width: 1024px;
                }
            }
            @media screen and (max-width: 992px) {
                div.contentblock {
                    width: 970px;
                }
            }

            .element-animation {
                top: 0px;
                opacity: 0;
                position: relative;
            }
            .element-animation.element-show {
                position: relative;
                top: 20px;
                opacity: 1;
                transition-duration: 1.4s;
            }

            .conteiner {
                background-size: 100%;
                overflow: hide;
                width: 100%;
                height: 50%;
            }
            .countdown-container {
                margin: 0;
                font-family: var(--font);
                font-size: 0.7rem;
                font-weight: 400;
                line-height: 1;
                -webkit-text-size-adjust: 80%;
                -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
                display: flex;
                justify-content: center;
                background-color: none;
            }

            .countdown-item {
                position: relative;
                min-width: 40px;
                margin-left: 10px;
                margin-right: 10px;
                padding-bottom: 10px;
            }

            .countdown:not(:last-child)::after {
                content: ":";
                position: absolute;
                right: -15px;
            }

            .countdown-item span {
                display: block;
                font-size: 35px;
                margin-bottom: 1px;
                color: #3f3f3f;
                border-radius: 5px;
                padding: 5px;
                animation: pulse 1s ease infinite alternate;
            }

            /* ===== Форма ответа ===== */
            #form {
                display: block;
                width: 100%;
                max-width: 380px;
                margin: 0 auto;
                padding: 0 24px;
                box-sizing: border-box;
                text-align: left;
            }

            .form-inner {
                position: relative;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .radio-group {
                display: flex;
                flex-direction: column;
                gap: 10px;
                width: 100%;
                margin: 0 0 6px;
            }

            .radio-option {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 13px 18px;
                background: rgba(255, 250, 242, 0.65);
                border: 1px solid rgba(98, 30, 7, 0.25);
                border-radius: 14px;
                cursor: pointer;
                transition:
                    background-color 0.2s ease,
                    border-color 0.2s ease,
                    box-shadow 0.2s ease;
            }
            .radio-option:hover {
                border-color: rgba(98, 30, 7, 0.55);
            }
            .radio-option:has(input:checked) {
                background: #fffaf2;
                border-color: #621e07;
                box-shadow: 0 0 0 1px #621e07;
            }
            .radio-option:has(input:focus-visible) {
                outline: 2px solid #c9a46a;
                outline-offset: 2px;
            }
            .radio-option input[type="radio"] {
                flex: none;
                width: 20px;
                height: 20px;
                margin: 0;
                accent-color: #621e07;
                cursor: pointer;
            }
            .radio-option label {
                flex: 1;
                margin: 0;
                padding: 0;
                font-size: 18px;
                line-height: 1.3;
                color: #3b2a22;
                text-transform: none;
                letter-spacing: 0.01em;
                cursor: pointer;
            }

            .form-inner textarea {
                display: block;
                width: 100%;
                height: 52px;
                padding: 13px 18px;
                margin: 0;
                box-sizing: border-box;
                resize: none;
                font-size: 18px;
                line-height: 1.3;
                color: #3b2a22;
                background-color: #fffaf2;
                border: 1px solid rgba(98, 30, 7, 0.35);
                border-radius: 14px;
                letter-spacing: 0.01em;
            }
            .form-inner textarea::placeholder {
                color: rgba(59, 42, 34, 0.5);
            }
            .form-inner textarea:focus {
                outline: none;
                border-color: #621e07;
                box-shadow: 0 0 0 1px #621e07;
            }

            .form-inner input[type="submit"] {
                display: block;
                width: 100%;
                height: 52px;
                margin: 4px 0 0;
                padding: 0 20px;
                font-size: 18px;
                font-weight: 500;
                letter-spacing: 0.06em;
                color: #f7ecdf;
                background: linear-gradient(160deg, #7d2a0d 0%, #621e07 55%, #4a1505 100%);
                border: 1px solid #c9a46a;
                border-radius: 14px;
                box-shadow: 0 8px 20px rgba(98, 30, 7, 0.3);
                cursor: pointer;
                transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease,
                    opacity 0.2s ease;
            }
            .form-inner input[type="submit"]:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 24px rgba(98, 30, 7, 0.4);
            }
            .form-inner input[type="submit"]:active {
                transform: scale(0.98);
            }
            .form-inner input[type="submit"]:focus-visible {
                outline: 2px solid #c9a46a;
                outline-offset: 3px;
            }
            .form-inner input[type="submit"]:disabled {
                opacity: 0.6;
                cursor: default;
                transform: none;
            }

            .form-status {
                min-height: 26px;
                margin: 2px 0 0;
                text-align: center;
                font-size: 18px;
                color: #621e07;
                opacity: 0;
                transform: translateY(6px);
                transition:
                    opacity 0.3s ease,
                    transform 0.3s ease;
            }
            .form-status.show {
                opacity: 1;
                transform: none;
            }

            body {
                background-color: #f2e6da;
            }
        </style>

        <style>
            .fade-in {
                opacity: 0;
                transform: translateY(20px);
                transition:
                    opacity 1s ease-out,
                    transform 1s ease-out;
            }
            .fade-in.visible {
                opacity: 1;
                transform: translateY(0);
            }
        </style>

        <style>
            /* Стили для модального окна */
            .modal {
                display: block; /* Модальное окно отображается сразу */
                position: fixed;
                z-index: 9999; /* Модальное окно поверх всех элементов */
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.8); /* Затемнённый фон */
            }
            .modal-content {
                background-color: #f2e6da;
                margin: 30% auto;
                padding: 20px;
                border: 1px solid #888;
                width: 80%;
                text-align: center;
            }
            .kk {
                width: 100%;
                height: 100%;
            }

            /* Кнопка «Шақыртуды ашу» */
            #playMusic {
                position: relative;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                margin-top: 18px;
                padding: 14px 38px;
                font-family: var(--font);
                font-size: 18px;
                font-weight: 500;
                letter-spacing: 0.06em;
                color: #f7ecdf;
                background: linear-gradient(160deg, #7d2a0d 0%, #621e07 55%, #4a1505 100%);
                border: 1px solid #c9a46a;
                border-radius: 999px;
                box-shadow:
                    0 0 0 4px rgba(201, 164, 106, 0.25),
                    0 8px 20px rgba(98, 30, 7, 0.35);
                cursor: pointer;
                transition:
                    transform 0.25s ease,
                    box-shadow 0.25s ease;
                animation: invitePulse 2.4s ease-in-out infinite;
            }
            #playMusic::before {
                content: "♪";
                font-size: 20px;
                color: #e3c48b;
            }
            #playMusic:hover {
                transform: translateY(-2px);
                box-shadow:
                    0 0 0 5px rgba(201, 164, 106, 0.35),
                    0 12px 26px rgba(98, 30, 7, 0.45);
            }
            #playMusic:active {
                transform: translateY(0) scale(0.97);
            }
            #playMusic:focus-visible {
                outline: 2px solid #c9a46a;
                outline-offset: 4px;
            }
            @keyframes invitePulse {
                0%,
                100% {
                    box-shadow:
                        0 0 0 4px rgba(201, 164, 106, 0.25),
                        0 8px 20px rgba(98, 30, 7, 0.35);
                }
                50% {
                    box-shadow:
                        0 0 0 10px rgba(201, 164, 106, 0),
                        0 8px 20px rgba(98, 30, 7, 0.35);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #playMusic {
                    animation: none;
                }
            }

            /* Отключение скроллинга страницы */
            body.modal-open {
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <div class="fade-in" id="content">
            <img src="photo1.jpg" style="width: 100%; height: 100%" loading="eager" />
        </div>

        <center>
            <div class="element-animation">
                <img src="photo2.jpg" style="width: 100%; margin-top: 0px" />
            </div>
        </center>

        <img src="photo3.jpg" style="width: 100%; left: 0px; margin-top: 50px" />

        <center>
            <div class="element-animation">
                <a href="https://go.2gis.com/pLxAa">
                    <img src="photo4.jpg" style="width: 100%; margin-top: 10px; margin-bottom: 0px"
                /></a>
            </div>
        </center>

        <center>
            <div class="element-animation">
                <img src="photo5.jpg" style="width: 100%; margin-top: 50px; margin-bottom: 10px" />
            </div>
        </center>

        <center style="margin-top: 0px">
            <form class="transparent" method="post" id="form">
                <div class="form-inner">
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="question1_yes" name="name" value="Иә барамын" required />
                            <label for="question1_yes">Иә барамын</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="question1_no" name="name" value="Бара алмаймын" required />
                            <label for="question1_no">Бара алмаймын</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="question1_maybe" name="name" value="Әзірге белгісіз" required />
                            <label for="question1_maybe">Әзірге белгісіз</label>
                        </div>
                    </div>
                    <textarea
                        required
                        name="message"
                        maxlength="100"
                        id="message"
                        cols="30"
                        rows="1"
                        placeholder="Есіміңізді жазыңыз"
                    ></textarea>
                    <input type="submit" value="Жіберу" />
                    <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
                </div>
            </form>
        </center>

        <center>
            <div class="element-animation">
                <img src="photo6.jpg" style="width: 100%; margin-top: 50px; margin-bottom: 15px" />
            </div>
        </center>

        <center>
            <div class="countdown-container" style="margin-top: 10px">
                <div class="countdown-item" style="margin-bottom: 30px">
                    <span id="days"></span>
                    <span style="font-size: 13px; text-align: center">күн</span>
                </div>
                <h2 style="margin-top: 3px; size: 30px">:</h2>
                <div class="countdown-item">
                    <span id="hours"></span>
                    <span style="font-size: 13px; text-align: center">сағат</span>
                </div>
                <h2 style="margin-top: 3px; size: 30px">:</h2>
                <div class="countdown-item">
                    <span id="minutes"></span>
                    <span style="font-size: 13px; text-align: center; text-align: center">минут</span>
                </div>
                <h2 style="margin-top: 3px; size: 30px">:</h2>
                <div class="countdown-item">
                    <span id="seconds"></span>
                    <span style="font-size: 13px; text-align: center">секунд</span>
                </div>
            </div>
        </center>

        <img src="photo7.jpg" style="width: 100%; margin-top: 50px" />

        <!-- Модальное окно -->
        <div id="musicModal" class="modal">
            <div class="modal-content">
                <img src="photo.jpg" />
                <button id="playMusic" type="button">Шақыртуды ашу</button>
            </div>
        </div>

        <audio id="backgroundMusic" loop>
            <source src="music.mp3" type="audio/mpeg" />
            Ваш браузер не поддерживает воспроизведение музыки.
        </audio>

        <script>
            // Получаем модальное окно, кнопку и аудио
            var modal = document.getElementById("musicModal");
            var playButton = document.getElementById("playMusic");
            var audio = document.getElementById("backgroundMusic");

            // При нажатии на кнопку включаем музыку и закрываем модальное окно
            playButton.onclick = function () {
                audio.play();
                closeModal();
            };

            // Функция для закрытия модального окна и разблокировки сайта
            function closeModal() {
                modal.style.display = "none"; // Скрываем модальное окно
                document.body.classList.remove("modal-open"); // Включаем прокрутку
            }
        </script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                var observer = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("visible");
                            observer.unobserve(entry.target);
                        }
                    });
                });

                var elements = document.querySelectorAll(".fade-in");
                elements.forEach(function (element) {
                    observer.observe(element);
                });
            });
        </script>

        <script>
            // Сюда вставьте ссылку веб-приложения Apps Script (заканчивается на /exec)
            const URL_APP =
                "https://script.google.com/macros/s/AKfycbyalybDsToBE0v6FBmHIaySxfJe1Ghsa3lPO_7BVZTsyVD0ZRNAfHdrBgVvvuBllIPyhA/exec";

            const form = document.querySelector("#form");
            const statusEl = document.querySelector("#formStatus");
            let statusTimer;

            form.action = URL_APP;

            // Мгновенный ответ гостю
            function showThanks() {
                statusEl.textContent = "Жауабыңызға рахмет!";
                statusEl.classList.add("show");
                clearTimeout(statusTimer);
                statusTimer = setTimeout(() => statusEl.classList.remove("show"), 5000);
            }

            // Отправка в таблицу в фоне (гость её не ждёт), до 3 попыток при сбое сети
            function sendInBackground(body, attempt = 1) {
                fetch(URL_APP, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                    mode: "no-cors",
                    body: body,
                    keepalive: true, // запрос дойдёт, даже если гость закроет страницу
                }).catch(err => {
                    console.error("Error:", err);
                    if (attempt < 3) {
                        setTimeout(() => sendInBackground(body, attempt + 1), 2000 * attempt);
                    }
                });
            }

            form.addEventListener("submit", ev => {
                ev.preventDefault();

                const checked = form.querySelector("[name=name]:checked");
                const name = checked ? checked.value : "";
                const message = form.querySelector("[name=message]").value.trim();

                if (!name || !message) {
                    alert("Жауабыңызды таңдап, есіміңізді жазыңыз");
                    return;
                }

                const body = new URLSearchParams({ name, message }).toString();

                form.reset();
                showThanks();
                sendInBackground(body);
            });

            function onEntry(entry) {
                entry.forEach(change => {
                    if (change.isIntersecting) {
                        change.target.classList.add("element-show");
                    }
                });
            }
            let options = {
                threshold: [0.5],
            };
            let observer = new IntersectionObserver(onEntry, options);
            let elements = document.querySelectorAll(".element-animation");

            for (let elm of elements) {
                observer.observe(elm);
            }
        </script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                function updateCountdown() {
                    const endDate = new Date("November 28, 2026 17:00:00").getTime();
                    const now = new Date().getTime();
                    const distance = endDate - now;

                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    document.getElementById("days").innerText = days;
                    document.getElementById("hours").innerText = hours;
                    document.getElementById("minutes").innerText = minutes;
                    document.getElementById("seconds").innerText = seconds;

                    if (distance < 0) {
                        clearInterval(timerInterval);
                        document.getElementById("days").innerText = "00";
                        document.getElementById("hours").innerText = "00";
                        document.getElementById("minutes").innerText = "00";
                        document.getElementById("seconds").innerText = "00";
                    }
                }

                const timerInterval = setInterval(updateCountdown, 1000);
                updateCountdown();
            });
        </script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"
            async
        ></script>
    </body>
</html>
